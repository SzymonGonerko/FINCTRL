[versions]
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
googleServices = "4.4.2"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
appcompat = "1.7.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
room = "2.6.1"
